<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Gravrust - Rust/WASM Client</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0a0a0f; font-family: 'Segoe UI', system-ui, sans-serif; color: #e0e0e0; }
    #boot { display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 12px; text-align: center; }
    #title { font-size: 30px; letter-spacing: 2px; color: #e94560; font-weight: bold; }
    #ver { color: #7fd17f; font-family: 'Consolas', monospace; font-size: 15px; }
    #steps { color: #a0a0a0; font-size: 12px; max-width: 90%; }
    .step { margin: 4px 0; padding: 6px; background: rgba(255,255,255,0.03);
      border-radius: 6px; border-left: 3px solid #7fd17f; text-align: left;
      word-break: break-all; max-height: 160px; overflow: auto; }
    .step.error { border-left-color: #e94560; color: #ff9999; }
    #game { display: none; image-rendering: pixelated; border: 1px solid #22223a;
      box-shadow: 0 0 40px rgba(233,69,96,0.15); }
    #hud { display: none; color: #8a8a9a; font-size: 12px; font-family: 'Consolas', monospace; }
  </style>
</head>
<body>
  <div id="boot">
    <div id="title">Gravrust</div>
    <div id="ver">initializing...</div>
    <div id="steps"></div>
  </div>
  <canvas id="game" width="480" height="270"></canvas>
  <div id="hud"></div>
  <script>
//__GLUE_JS__
  </script>
  <script>
    const wasmBase64 = '__WASM_B64__';
    var GAME_ASSETS = __ASSET_MANIFEST__;
    (async () => {
      const steps = document.getElementById('steps');
      const ver = document.getElementById('ver');
      const log = (t, err) => { steps.innerHTML += '<div class="step' + (err ? ' error' : '') + '">' + t + '</div>'; };
      try {
        const binary = atob(wasmBase64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        log('WASM decoded: ' + bytes.length + ' bytes | assets baked: ' + GAME_ASSETS.length);

        const w = window.__GRV_INIT(bytes); // initSync: compile + instantiate + start
        log('WASM instantiated: ' + Object.keys(w).length + ' exports');
        if (w.init_wasm) { w.init_wasm(); log('init_wasm() OK - Rust core initialized'); }

        if (typeof GameRenderer !== 'function') throw new Error('GameRenderer not exported');
        const W = 480, H = 270;
        const renderer = new GameRenderer(W, H);
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const img = ctx.createImageData(W, H);

        let last = performance.now();
        function loop(now) {
          const dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          const len = renderer.tick(dt);
          const ptr = renderer.frame();
          const pixels = new Uint8Array(w.memory.buffer, ptr, len);
          img.data.set(pixels);
          ctx.putImageData(img, 0, 0);
          document.getElementById('hud').textContent =
            'rust software renderer | ' + W + 'x' + H + ' | assets: ' + GAME_ASSETS.length;
          requestAnimationFrame(loop);
        }
        document.getElementById('boot').style.display = 'none';
        canvas.style.display = 'block';
        document.getElementById('hud').style.display = 'block';
        log('GameRenderer started - rendering in Rust');
        requestAnimationFrame(loop);
        window.__GRAVRUST_OK = true;
      } catch (e) {
        ver.textContent = 'WASM failed to load';
        log('ERROR: ' + String(e), true);
        window.__GRAVRUST_OK = { error: String(e) };
      }
    })();
  </script>
</body>
</html>
